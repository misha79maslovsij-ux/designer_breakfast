<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дизайнерские завтраки</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0a0a0a;
    color:white;
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.title{
    font-size:82px;
    font-weight:700;
    line-height:1;
    letter-spacing:6px;
    text-transform:uppercase;
    margin-bottom:30px;
}

.subtitle{
    font-size:15px;
    color:#9d9d9d;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:60px;
}

.btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:white;
    padding:18px 42px;
    cursor:pointer;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    transition:0.4s;
}

.btn:hover{
    background:white;
    color:black;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(12px);
    z-index:1000;
    padding:20px;
}

.modal-content{
    width:100%;
    max-width:520px;
    background:#111;
    border:1px solid rgba(255,255,255,0.08);
    padding:45px;
}

.modal-content h2{
    margin-bottom:25px;
    font-weight:500;
    letter-spacing:2px;
}

.close{
    float:right;
    cursor:pointer;
    color:#888;
    font-size:24px;
}

input{
    width:100%;
    padding:17px;
    margin-bottom:14px;
    background:#1a1a1a;
    border:1px solid rgba(255,255,255,0.08);
    color:white;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:white;
}

.checkbox{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-top:12px;
    margin-bottom:24px;
    text-align:left;
}

.checkbox input{
    width:auto;
    margin:4px 0 0 0;
}

.checkbox span{
    color:#8e8e8e;
    font-size:12px;
    line-height:1.6;
}

.checkbox a{
    color:white;
}

.submit-btn{
    width:100%;
    padding:18px;
    background:white;
    color:black;
    border:none;
    cursor:pointer;
    font-weight:600;
    letter-spacing:2px;
}

.success-popup{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.82);
    display:none;
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(12px);
    z-index:2000;
    padding:20px;
}

.success-box{
    width:100%;
    max-width:430px;
    background:#111;
    border:1px solid rgba(255,255,255,0.08);
    padding:50px 40px;
    text-align:center;
}

.success-title{
    font-size:30px;
    line-height:1.3;
    margin-bottom:18px;
    font-weight:600;
}

.success-text{
    color:#9d9d9d;
    line-height:1.8;
    margin-bottom:35px;
    font-size:15px;
}

.success-button{
    background:white;
    color:black;
    border:none;
    padding:16px 34px;
    cursor:pointer;
    font-weight:600;
}

@media(max-width:768px){

.title{
    font-size:42px;
    letter-spacing:3px;
}

.subtitle{
    font-size:12px;
    line-height:1.6;
}

.modal-content{
    padding:30px;
}

.success-box{
    padding:40px 25px;
}

.success-title{
    font-size:24px;
}

}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        Дизайнерские<br>
        завтраки
    </div>

    <div class="subtitle">
        Генеральный спонсор — Галерея Арт Деко
    </div>

    <button class="btn" onclick="openModal()">
        Регистрация
    </button>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">✕</span>

        <h2>Регистрация</h2>

        <form id="form">

            <input type="text" id="name" placeholder="Имя" required>

            <input type="text" id="lastname" placeholder="Фамилия" required>

            <input type="text" id="job" placeholder="Род деятельности" required>

            <input type="tel" id="phone" placeholder="Номер телефона" required>

            <label class="checkbox">

                <input type="checkbox" required>

                <span>
                    Я соглашаюсь с
                    <a href="privacy.html" target="_blank">
                        политикой обработки персональных данных
                    </a>
                </span>

            </label>

            <button type="submit" class="submit-btn">
                Зарегистрироваться
            </button>

        </form>

    </div>

</div>

<div class="success-popup" id="successPopup">

    <div class="success-box">

        <div class="success-title">
            Вы успешно зарегистрированы
        </div>

        <div class="success-text">
            Будем рады видеть вас<br>
            в Галерее Арт Деко
        </div>

        <button class="success-button" onclick="closeSuccess()">
            Закрыть
        </button>

    </div>

</div>

<script>

const scriptURL = 'https://script.google.com/macros/s/AKfycbwlBE6NmcV1zu_oEhEV2IQCEUq1sSrtvGL4Jdi4Cwdgx-Vnmjb5wAE9YxKcJ22t2VVs-A/exec';

function openModal(){
    document.getElementById('modal').style.display='flex';
}

function closeModal(){
    document.getElementById('modal').style.display='none';
}

window.onclick=function(event){
    const modal=document.getElementById('modal');

    if(event.target==modal){
        modal.style.display='none';
    }
}

function closeSuccess(){
    document.getElementById('successPopup').style.display='none';
}

document.getElementById('form')
.addEventListener('submit', async (e)=>{

    e.preventDefault();

    const submitButton = document.querySelector('.submit-btn');

    submitButton.innerText='Отправка...';
    submitButton.disabled=true;

    const data = {
        name: document.getElementById('name').value,
        lastname: document.getElementById('lastname').value,
        job: document.getElementById('job').value,
        phone: document.getElementById('phone').value
    };

    try{

        await fetch(scriptURL, {
            method:'POST',
            body:JSON.stringify(data)
        });

        closeModal();

        document.getElementById('successPopup')
        .style.display='flex';

        document.getElementById('form').reset();

    }catch(error){

        alert('Ошибка отправки. Попробуйте снова.');

    }

    submitButton.innerText='Зарегистрироваться';
    submitButton.disabled=false;

});

</script>

</body>
</html>
